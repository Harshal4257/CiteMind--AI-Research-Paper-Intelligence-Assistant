services:
  - type: web
    # Change this to a unique name in your Render account before syncing.
    name: ai-ml-research-paper-rag
    runtime: docker
    plan: 2c-4g
    healthCheckPath: /
    envVars:
      - key: LLM_PROVIDER
        value: local_huggingface
      - key: LLM_MODEL
        value: Qwen/Qwen2.5-0.5B-Instruct
      - key: LOCAL_DEVICE
        value: "-1"
      - key: PAPERS_DIR
        value: /app/storage/papers
      - key: VECTOR_STORE_DIR
        value: /app/storage/vectorstore
      - key: HF_HOME
        value: /app/storage/huggingface
      - key: MAX_NEW_TOKENS
        value: "120"
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: rag-data
      mountPath: /app/storage
      sizeGB: 6
